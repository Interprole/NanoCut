name: Windows desktop verification
on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "web/**"
      - "packaging/**"
      - "requirements*.txt"
      - ".github/workflows/windows.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the desktop runtime
        shell: powershell
        run: |
          ./packaging/setup.ps1
          $pythonDir = [IO.File]::ReadAllText("$env:LOCALAPPDATA\NanoCutRuntime\python-path.txt")
          $pythonDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$env:LOCALAPPDATA\NanoCutRuntime\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify real frame and audio exports
        run: python -m unittest discover -s tests -v
      - name: Exercise the editor window
        shell: pwsh
        run: |
          python -m pip install playwright
          $env:NANOCUT_TEST_BROWSER = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          python tests/smoke_ui.py
      - name: Launch the installed Start menu shortcut
        shell: pwsh
        run: |
          $installer = Start-Process ".\downloads\NanoCut-Setup.exe" -ArgumentList "/S" -PassThru -Wait
          if ($installer.ExitCode -ne 0) { throw "The installer failed." }
          $installed = "$env:LOCALAPPDATA\Programs\NanoCut"
          foreach ($file in @("NanoCut.py", "web\app.js", "packaging\setup.ps1")) {
            if ((Get-FileHash "$installed\$file").Hash -ne (Get-FileHash $file).Hash) {
              throw "The installer contains an outdated copy of $file."
            }
          }
          $shortcut = Join-Path ([Environment]::GetFolderPath("Programs")) "NanoCut\NanoCut.lnk"
          Start-Process $shortcut
          $deadline = [DateTime]::UtcNow.AddSeconds(40)
          $localUrl = $null
          do {
            Start-Sleep -Milliseconds 500
            $processes = Get-CimInstance Win32_Process -Filter "Name='msedge.exe' OR Name='chrome.exe'"
            foreach ($process in $processes) {
              if ($process.CommandLine -match '--app=(http://127\.0\.0\.1:\d+/[A-Za-z0-9_-]+/)') {
                $localUrl = $Matches[1]
                break
              }
            }
          } until ($localUrl -or [DateTime]::UtcNow -gt $deadline)
          if (-not $localUrl) { throw "The installed desktop window did not start." }
          $response = Invoke-WebRequest -Uri $localUrl
          if ($response.Content -notmatch '<title>NanoCut</title>') { throw "The desktop window did not load the editor." }
          Write-Host "The installed editor opened from its Start menu shortcut."
