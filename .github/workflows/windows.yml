name: Windows desktop release
on:
  push:
    branches: [main]
    paths-ignore: ['downloads/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows GUI and graphical installer
        shell: pwsh
        run: |
          dotnet build desktop/NanoCut.csproj -c Release -o dist/host
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $compiler = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $compiler)) { choco install nsis -y --no-progress }
          & $compiler packaging/installer.nsi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install twice and verify dependency reuse
        shell: pwsh
        run: |
          $setup = Resolve-Path dist/NanoCut-1.1.0.1-Setup.exe
          $app = "$env:LOCALAPPDATA\Programs\NanoCut"
          $cfg = "$env:LOCALAPPDATA\NanoCutRuntime\runtime-1.1.json"
          for ($i=0; $i -lt 2; $i++) {
            if ($i) { $env:PIP_NO_INDEX = "1" }
            $p = Start-Process $setup -ArgumentList '/S /COREONLY' -PassThru -Wait
            if ($p.ExitCode -ne 0) {
              Get-Content "$env:LOCALAPPDATA\NanoCutRuntime\setup.log" -Tail 40 -ErrorAction SilentlyContinue
              throw "Installer failed on pass $i."
            }
            $config = Get-Content $cfg -Raw | ConvertFrom-Json
            $check = & $config.python -c "import yt_dlp,os;print(os.stat(yt_dlp.__file__).st_mtime_ns)"
            if ($i -and $check -ne $first) { throw "A satisfied package was replaced." }
            $first = $check
          }
          (Split-Path $config.python) >> $env:GITHUB_PATH
          $config.paths | ForEach-Object { $_ >> $env:GITHUB_PATH }
          if ((Get-Item "$app\NanoCut.exe").VersionInfo.ProductVersion -notlike '1.1.0.1*') { throw "Incorrect desktop version." }
      - name: Prepare base Whisper and foreground components
        shell: pwsh
        run: |
          $p = Start-Process (Resolve-Path dist/NanoCut-1.1.0.1-Setup.exe) -ArgumentList '/S /BASEAI' -Wait -PassThru
          if ($p.ExitCode) {
            Get-Content "$env:LOCALAPPDATA\NanoCutRuntime\setup.log" -Tail 60
            throw "AI component installation failed."
          }
          $env:HF_HUB_OFFLINE = "1"
          python -c "from faster_whisper import WhisperModel; WhisperModel('base', device='cpu', compute_type='int8', local_files_only=True)"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -c "from rembg import new_session; new_session('u2netp', providers=['CPUExecutionProvider'])"
      - name: Test exports and edit a project
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install playwright
          $env:NANOCUT_TEST_BROWSER = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          python tests/smoke_ui.py
      - name: Launch installed desktop window
        shell: pwsh
        run: |
          $shortcut = Join-Path ([Environment]::GetFolderPath("Programs")) "NanoCut\NanoCut.lnk"
          Start-Process $shortcut
          $deadline = [DateTime]::UtcNow.AddSeconds(45)
          do {
            Start-Sleep -Milliseconds 400
            $editor = Get-Process NanoCut -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle -like 'NanoCut 1.1.0.1*Editor' }
          } until ($editor -or [DateTime]::UtcNow -gt $deadline)
          if (!$editor) { throw "The installed WebView2 editor did not finish loading." }
          $editor.CloseMainWindow()
      - uses: actions/upload-artifact@v4
        with:
          name: NanoCut-1.1.0.1-Windows
          path: dist/NanoCut-1.1.0.1-Setup.exe
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NanoCut-1.1.0.1-Windows
          path: dist
      - name: Publish version 1.1.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v1.1.0.1
          asset=NanoCut-1.1.0.1-Setup.exe
          notes=$(mktemp)
          cat > "$notes" <<EOF
          Linked multitrack editing, frame ranges, script-aligned captions and dubbing. This Windows installer includes offline subtitle translation with CTranslate2 and corrected local guide-audio import.

          [Installer build 2 source](https://github.com/Interprole/NanoCut/tree/$GITHUB_SHA)
          EOF
          if gh release view "$tag" --json body --jq .body | grep -Fq 'Installer build 2 source'; then exit 0; fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "dist/$asset" --clobber
            gh release edit "$tag" --notes-file "$notes"
          else
            gh release create "$tag" "dist/$asset" --target "$GITHUB_SHA" --title 'NanoCut 1.1.0.1' --notes-file "$notes"
          fi
          cp dist/NanoCut-1.1.0.1-Setup.exe downloads/NanoCut-Setup.exe
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add downloads/NanoCut-Setup.exe
          git commit -m 'Distribute verified version 1.1.0.1 through the existing download link'
          git push origin HEAD:main
